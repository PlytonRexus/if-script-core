name: CI Push

on:
  push:
    branches:
      - custom-parser
      - robustness-fixes

permissions:
  contents: read

concurrency:
  group: ci-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    name: Test and Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Suite
        run: npm test

      - name: Build Project
        run: npm run build
