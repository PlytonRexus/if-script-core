name: Deploy gh-pages

on:
  workflow_run:
    workflows:
      - CI Push
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish Thrones Pages
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (
        github.event.workflow_run.head_branch == 'custom-parser' ||
        github.event.workflow_run.head_branch == 'robustness-fixes'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Trigger Commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configure Authenticated Origin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      - name: Install Dependencies
        run: npm ci

      - name: Publish To gh-pages Branch
        env:
          PAGES_REMOTE: origin
          PAGES_BRANCH: gh-pages
        run: npm run publish:pages:thrones
